<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BigStar API Health</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #e2e8f0;
      }

      main {
        width: min(28rem, calc(100% - 3rem));
        padding: 2rem;
        border: 1px solid #334155;
        border-radius: 1rem;
        background: #1e293b;
        box-shadow: 0 1rem 3rem rgb(0 0 0 / 25%);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
      }

      p {
        margin: 0;
        color: #cbd5e1;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 1.5rem;
        color: #86efac;
        font-weight: 700;
      }

      .status::before {
        width: 0.75rem;
        height: 0.75rem;
        border-radius: 50%;
        background: #22c55e;
        content: "";
        box-shadow: 0 0 0 0.25rem rgb(34 197 94 / 15%);
      }

      a {
        display: inline-block;
        margin-top: 1.25rem;
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>BigStar API</h1>
      <p>This service is online and serving HTTP requests.</p>
      <div class="status">Online</div>
      <br />
      <a href="/api/health">View database health JSON</a>
    </main>
  </body>
</html>
